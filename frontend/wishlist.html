<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TrendCart | My Wishlist</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #FEFAF0;
      color: #1E2A1C;
      scroll-behavior: smooth;
    }
    :root {
      --primary-dark: #25671E;
      --primary-soft: #F6F09F;
      --card-white: #FFFFFF;
      --shadow-sm: 0 10px 25px -5px rgba(0,0,0,0.05);
      --shadow-md: 0 20px 25px -12px rgba(0,0,0,0.08);
      --transition: all 0.25s ease;
    }
    .container { max-width: 1280px; margin: 0 auto; padding: 0 24px; }
    .navbar {
      background-color: var(--primary-dark);
      padding: 1rem 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .logo h1 { font-size: 1.8rem; font-weight: 700; color: var(--primary-soft); }
    .logo span { font-weight: 400; font-size: 0.9rem; color: #e9e2b0; }
    .nav-links {
      display: flex;
      gap: 1.5rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .nav-links a {
      text-decoration: none;
      font-weight: 500;
      color: #FEF7DA;
      transition: var(--transition);
    }
    .nav-links a:hover, .nav-links a.active { color: white; border-bottom: 1px solid var(--primary-soft); }
    .cart-icon { cursor: pointer; font-size: 1.4rem; color: var(--primary-soft); position: relative; }
    .cart-count {
      position: absolute; top: -10px; right: -12px; background-color: #F6F09F;
      color: #1F3B1A; font-size: 0.7rem; font-weight: 700; border-radius: 50%;
      width: 20px; height: 20px; display: flex; align-items: center; justify-content: center;
    }
    .page-header {
      margin: 2rem 0 1.5rem;
    }
    .page-header h1 {
      font-size: 2rem;
      color: #1B3A16;
    }
    .wishlist-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 2rem;
      margin-bottom: 3rem;
    }
    .wishlist-card {
      background: white;
      border-radius: 1.5rem;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
      border: 1px solid #f0ead9;
      position: relative;
    }
    .wishlist-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
    .wishlist-img {
      width: 100%;
      height: 280px;
      object-fit: cover;
    }
    .wishlist-info { padding: 1rem; }
    .wishlist-title { font-weight: 600; font-size: 1.1rem; margin-bottom: 0.3rem; }
    .wishlist-price { color: var(--primary-dark); font-weight: 700; margin: 0.5rem 0; }
    .wishlist-actions {
      display: flex;
      gap: 0.8rem;
      margin-top: 0.8rem;
    }
    .btn-cart, .btn-remove {
      flex: 1;
      padding: 0.5rem;
      border-radius: 40px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      transition: 0.2s;
    }
    .btn-cart {
      background: var(--primary-dark);
      color: var(--primary-soft);
      border: none;
    }
    .btn-cart:hover { background: #1B4F15; }
    .btn-remove {
      background: transparent;
      border: 1px solid #d4cfbb;
      color: #7a6e52;
    }
    .btn-remove:hover { background: #f5f0e0; border-color: #b0a88a; }
    .empty-msg {
      text-align: center;
      padding: 4rem;
      background: white;
      border-radius: 2rem;
      color: #7a6e52;
    }
    .footer {
      background: var(--primary-dark);
      color: #FBF5DA;
      padding: 3rem 0 1.5rem;
      margin-top: 4rem;
    }
    
    .footer-grid { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2rem; }
    .copyright { text-align: center; border-top: 1px solid #3C6E34; padding-top: 1.8rem; margin-top: 2rem; }
    .toast-msg {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: #1F3B1A; color: #F6F09F; padding: 10px 20px; border-radius: 50px;
      z-index: 400; opacity: 0; transition: 0.2s; pointer-events: none;
    }
    .toast-msg.show { opacity: 1; }
    @media (max-width: 780px) { .nav-container { flex-direction: column; } }
  </style>
</head>
<body>

<div class="navbar">
  <div class="container nav-container">
    <div class="logo"><a href="index.html" style="text-decoration:none;"><h1>TRENDCART <span>· women</span></h1></a></div>
    <div class="nav-links">
      <a href="index.html">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="wishlist.html" class="active">Wishlist</a>
      <a href="orders.html">Orders</a>
      <a href="account.html">Account</a>
      <div class="cart-icon" id="cartIcon"><i class="fas fa-bag-shopping"></i><span class="cart-count" id="cartCountDisplay">0</span></div>
    </div>
  </div>
</div>

<main class="container">
  <div class="page-header">
    <h1><i class="fas fa-heart" style="color: #e07c3c;"></i> My Wishlist</h1>
    <p>Save your favorite pieces for later</p>
  </div>
  <div id="wishlistContainer" class="wishlist-grid"></div>
</main>

<footer class="footer">
  <div class="container">
    <div class="footer-grid">
      <div><h4>TrendCart</h4><p>Conscious clothing for the modern woman.</p></div>
      <div><h4>Help</h4><p>Shipping & Returns<br>Size Guide<br>FAQs</p></div>
      <div><h4>Connect</h4><i class="fab fa-instagram"></i> <i class="fab fa-pinterest"></i> <i class="fab fa-twitter"></i></div>
    </div>
    <div class="copyright"><p>🌿 Ethically made | Free shipping on orders $100+</p></div>
  </div>
</footer>
<div id="toastMsg" class="toast-msg"></div>

<script>
  const user = JSON.parse(localStorage.getItem("trendcart_user"));

if (!user) {
  window.location.href = "login.html";
}
  let wishlist = JSON.parse(localStorage.getItem('trendcart_wishlist')) || [];
  let cart = JSON.parse(localStorage.getItem('trendcart_cart')) || [];

  function showToast(msg) {
    const t = document.getElementById('toastMsg');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  function saveWishlist() {
    localStorage.setItem('trendcart_wishlist', JSON.stringify(wishlist));
  }

  function updateCartCount() {
    const total = cart.reduce((s, i) => s + i.quantity, 0);
    document.getElementById('cartCountDisplay').innerText = total;
  }

  function renderWishlist() {
    wishlist = wishlist.filter(item => item && item.name && item.price && item.image);
    const container = document.getElementById('wishlistContainer');
    if (!wishlist.length) {
      container.innerHTML = `<div class="empty-msg"><i class="fas fa-heart-broken" style="font-size:3rem; margin-bottom:1rem; display:block;"></i> Your wishlist is empty.<br> <a href="index.html" style="color:var(--primary-dark);">Explore new arrivals →</a></div>`;
      return;
    }
    container.innerHTML = wishlist.map(item => `
      <div class="wishlist-card" data-id="${item.id}">
        <img class="wishlist-img" src="${item.image}" alt="${item.name}">
        <div class="wishlist-info">
          <div class="wishlist-title">${item.name}</div>
          <div class="wishlist-price">$${item.price}</div>
          <div class="wishlist-actions">
            <div class="btn-cart" data-id="${item.id}"><i class="fas fa-shopping-bag"></i> Add to cart</div>
            <div class="btn-remove" data-id="${item.id}"><i class="fas fa-trash-alt"></i> Remove</div>
          </div>
        </div>
      </div>
    `).join('');
    // attach events
    document.querySelectorAll('.btn-cart').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const id = parseInt(btn.dataset.id);
        const product = wishlist.find(p => p.id === id);
        if (product) {
          const existing = cart.find(i => i.id === id);
          if (existing) existing.quantity += 1;
          else cart.push({ ...product, quantity: 1 });
          localStorage.setItem('trendcart_cart', JSON.stringify(cart));
          updateCartCount();
          showToast(`✓ ${product.name} added to cart`);
        }
      });
    });
    document.querySelectorAll('.btn-remove').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const id = parseInt(btn.dataset.id);
        const token = localStorage.getItem("token");

fetch(`${API_BASE_URL}/wishlist/${id}`, {
  method: "DELETE",
  headers: {
    "Authorization": `Bearer ${token}`
  }
})
.then(res => res.json())
.then(() => {
  wishlist = wishlist.filter(p => p.id !== id);
  renderWishlist();
  showToast("Removed from wishlist");
});
        showToast('Removed from wishlist');
      });
    });
  }

  function updateCartCountFromStorage() {
    cart = JSON.parse(localStorage.getItem('trendcart_cart')) || [];
    updateCartCount();
  }

  document.getElementById('cartIcon')?.addEventListener('click', () => {
    window.location.href = 'index.html#cart-drawer';
  });

  updateCartCountFromStorage();
  const API_BASE_URL = "https://trendcart-2.onrender.com";

function fetchWishlist() {
  const token = localStorage.getItem("token");

  fetch(`${API_BASE_URL}/wishlist`, {
    headers: {
      "Authorization": `Bearer ${token}`
    }
  })
  .then(res => res.json())
  .then(data => {
    wishlist = data.wishlist || [];
    renderWishlist();
  })
  .catch(err => {
    console.error(err);
    showToast("Failed to load wishlist 😢");
  });
}

fetchWishlist();
</script>
</body>
</html>
