<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TrendCart | Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #FEFAF0 0%, #FDF4CF 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    :root {
      --primary-dark: #25671E;
      --primary-soft: #F6F09F;
      --card-white: #FFFFFF;
      --shadow-md: 0 20px 25px -12px rgba(0,0,0,0.1);
    }
    .container {
      max-width: 480px;
      margin: 2rem auto;
      padding: 0 1rem;
      flex: 1;
    }
    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .logo h1 {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--primary-dark);
    }
    .logo span {
      font-weight: 400;
      font-size: 0.9rem;
      color: #4a6b3e;
    }
    .card {
      background: var(--card-white);
      border-radius: 2rem;
      padding: 2rem 1.8rem;
      box-shadow: var(--shadow-md);
      border: 1px solid #f0ead9;
    }
    .card h2 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      color: #1B3A16;
    }
    .card p {
      color: #5a5a5a;
      margin-bottom: 1.8rem;
    }
    .input-group {
      margin-bottom: 1.2rem;
    }
    .input-group label {
      display: block;
      font-weight: 500;
      margin-bottom: 0.4rem;
      color: #1E2A1C;
    }
    .input-group input {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 1px solid #e0dbc9;
      border-radius: 1rem;
      font-family: 'Inter', sans-serif;
      background: #FEFCF7;
      transition: 0.2s;
    }
    .input-group input:focus {
      outline: none;
      border-color: var(--primary-dark);
      box-shadow: 0 0 0 2px rgba(37,103,30,0.2);
    }
    .checkbox {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin: 1rem 0;
    }
    .checkbox input {
      width: 18px;
      height: 18px;
    }
    button {
      background: var(--primary-dark);
      color: var(--primary-soft);
      border: none;
      width: 100%;
      padding: 0.9rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 0.5rem;
    }
    button:hover {
      background: #1B4F15;
      transform: translateY(-2px);
    }
    .links {
      text-align: center;
      margin-top: 1.5rem;
    }
    .links a {
      color: var(--primary-dark);
      text-decoration: none;
      font-weight: 500;
    }
    .links a:hover {
      text-decoration: underline;
    }
    

    .toast-msg {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #1F3B1A;
      color: #F6F09F;
      padding: 10px 20px;
      border-radius: 50px;
      font-size: 0.9rem;
      z-index: 400;
      opacity: 0;
      transition: 0.2s;
      pointer-events: none;
    }
    .toast-msg.show { opacity: 1; }
    footer {
      text-align: center;
      padding: 2rem;
      font-size: 0.8rem;
      color: #5a5a5a;
    }
    
  </style>
</head>
<body>

<div class="container">
  <div class="logo">
    <a href="index.html" style="text-decoration: none;"><h1>TRENDCART <span>· women</span></h1></a>
  </div>
  <div class="card">
    <h2>Welcome back</h2>
    <p>Log in to your TrendCart account</p>

    <form id="loginForm">
      <div class="input-group">
        <label>Email address</label>
        <input type="email" id="loginEmail" placeholder="hello@example.com" required>
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required>
      </div>
      <div class="checkbox">
        <input type="checkbox" id="rememberMe">
        <label for="rememberMe" style="margin-bottom:0;">Remember me</label>
      </div>
      <button type="submit">Log in →</button>
    </form>

    <div class="links">
      <a href="#">Forgot password?</a> &nbsp;|&nbsp;
      <a href="signup.html">Create account</a>
    </div>
  </div>
</div>

<footer>
  <p>🌿 Ethically made | Free shipping on orders $100+</p>
</footer>

<div id="toastMsg" class="toast-msg"></div>

<script>
  function showToast(msg) {
    const toast = document.getElementById('toastMsg');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  }

  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value.trim();

    if (!email || !password) {
      showToast('Please fill in both fields');
      return;
    }
    if (!email.includes('@')) {
      showToast('Enter a valid email address');
      return;
    }
    // Simulate login (demo only)
    // In a real app, you'd check credentials against a backend.
    // For demo, we just show success and redirect to index.
    const API_BASE_URL = "https://trendcart-2.onrender.com"; // apna backend

fetch(`${API_BASE_URL}/auth/login`, {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({ email, password })
})
.then(res => res.json())
.then(data => {
  if (data.success) {
    localStorage.setItem("trendcart_user", JSON.stringify(data.user));
    localStorage.setItem("token", data.token);

    showToast("Login successful 🚀");

    setTimeout(() => {
      window.location.href = "index.html";
    }, 1500);
  } else {
    showToast(data.message || "Login failed");
  }
})
.catch(err => {
  console.error(err);
  showToast("Server error 😢");
});
    const userData = {
  name: email.split("@")[0], // simple demo name
  email: email
};

localStorage.setItem("trendcart_user", JSON.stringify(userData));
    setTimeout(() => {
      window.location.href = 'index.html';
    }, 1500);
  });
</script>
</body>
</html>
